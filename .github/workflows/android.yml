name: app test - Android
on:
  push:
    branches: [app-test]
    paths: ['android/**', 'flows/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_CODE: ${{ secrets.DEMO_CODE }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots-android, path: shots }
