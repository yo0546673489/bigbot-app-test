name: emulator build
run-name: ${{ inputs.label }}
# Builds the debug app of a branch, with everything that did not change taken from the last build.
# The APK leaves the job only sealed with EMU_LIVE_KEY: this repo and its artifacts are public.
# variant=fast is the build for the private link. Its keys get compiled into it, so its build cache
# is sealed too, and only a build with all the keys and the right signature is named "apk".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'App repo branch or commit'
        required: true
      label:
        description: 'build-<commit> or fast-<commit>: a finished build of the same commit is used again'
        required: true
      variant:
        description: 'debug or fast'
        required: false
        default: debug
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
      - uses: actions/checkout@v4
        with:
          repository: yo0546673489/bigbot
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.APP_REPO_KEY }}
          path: app
          fetch-depth: 1
          sparse-checkout: bigbot/android
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ inputs.variant == 'fast' }}
      - uses: actions/cache@v4
        if: inputs.variant != 'fast'
        with:
          key: app-build-${{ github.run_id }}
          restore-keys: app-build-
          path: |
            app/bigbot/android/.gradle
            app/bigbot/android/build
            app/bigbot/android/app/build
      - uses: actions/cache/restore@v4
        if: inputs.variant == 'fast'
        with:
          key: app-fast-${{ github.run_id }}
          restore-keys: app-fast-
          path: fast-cache.bin
      - name: open the sealed cache and the keys
        if: inputs.variant == 'fast'
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
          LINK_KEYSTORE_B64: ${{ secrets.LINK_KEYSTORE_B64 }}
          LINK_TG_API_HASH: ${{ secrets.LINK_TG_API_HASH }}
          LINK_PRIVATE_BASE: ${{ secrets.LINK_PRIVATE_BASE }}
        run: |
          if [ -f fast-cache.bin ]; then
            node self/live/unseal-file.js fast-cache.bin /tmp/fc.tar
            tar xf /tmp/fc.tar -C app/bigbot/android
            rm -f /tmp/fc.tar fast-cache.bin
          fi
          if [ -n "$LINK_KEYSTORE_B64" ] && [ -n "$LINK_TG_API_HASH" ] && [ -n "$LINK_PRIVATE_BASE" ]; then
            mkdir -p ~/.android app/bigbot/android/keystore
            printf '%s' "$LINK_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            printf 'TG_API_HASH=%s\n' "$LINK_TG_API_HASH" > app/bigbot/android/keystore/tg.properties
            printf 'PRIVATE_CHANNEL_BASE=%s\n' "$LINK_PRIVATE_BASE" > app/bigbot/android/keystore/private-channel.properties
            echo "HAS_KEYS=1" >> "$GITHUB_ENV"
          fi
      - name: build
        working-directory: app/bigbot/android
        env:
          TASK: ${{ inputs.variant == 'fast' && 'assembleFast' || 'assembleDebug' }}
        run: |
          chmod +x gradlew
          ./gradlew "-Dorg.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx6g" -Pkotlin.incremental=true --build-cache --parallel ":app:$TASK" -q > /tmp/build.out 2> /tmp/build.err
      - name: seal the errors
        if: failure()
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          mkdir -p err
          node self/live/seal-file.js /tmp/build.err err/err.bin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: err
          path: err/err.bin
          retention-days: 3
      - name: check the signature
        if: inputs.variant == 'fast' && env.HAS_KEYS == '1'
        run: |
          TOOL="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          APK=app/bigbot/android/app/build/outputs/apk/fast/app-fast.apk
          # Gradle can sign with another debug key it finds, so the link key is put on explicitly
          find ~ -name debug.keystore -not -path '*/caches/*' 2>/dev/null | sed "s#$HOME#~#" || true
          echo "gradle signed with $("$TOOL" verify --print-certs "$APK" | sed -n -E 's/.*SHA-256 digest: ([0-9a-f]{8}).*/\1/p' | head -1)"
          "$TOOL" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v4-signing-enabled false "$APK"
          WANT=a0a6472872ee8a3e9b063c562a2451eca74abc16e1d33ea71ff240c558c80138
          GOT=$("$TOOL" verify --print-certs "$APK" | sed -n -E 's/.*SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          KEY=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | sed -n -E 's/.*SHA256: //p' | tr -d ': ' | tr 'A-F' 'a-f' | head -1)
          echo "want ${WANT:0:8} apk ${GOT:0:8} key ${KEY:0:8} keysize $(stat -c %s ~/.android/debug.keystore)"
          [ "$GOT" = "$WANT" ]
      - name: seal
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
          APK: ${{ inputs.variant == 'fast' && 'fast/app-fast.apk' || 'debug/app-debug.apk' }}
        run: |
          mkdir -p out
          node self/live/seal-file.js "app/bigbot/android/app/build/outputs/apk/$APK" out/app.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (inputs.variant != 'fast' || env.HAS_KEYS == '1') && 'apk' || 'apk-without-keys' }}
          path: out/app.bin
          compression-level: 0
          retention-days: 3
      - name: seal the cache
        if: inputs.variant == 'fast'
        continue-on-error: true
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          cd app/bigbot/android
          tar cf /tmp/fc.tar --exclude=app/build/outputs $(ls -d .gradle build app/build 2>/dev/null)
          cd - > /dev/null
          node self/live/seal-file.js /tmp/fc.tar fast-cache.bin
          rm -f /tmp/fc.tar
      - uses: actions/cache/save@v4
        if: inputs.variant == 'fast'
        continue-on-error: true
        with:
          key: app-fast-${{ github.run_id }}
          path: fast-cache.bin
      - name: keep only the last sealed cache
        if: inputs.variant == 'fast'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NOW: app-fast-${{ github.run_id }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key app-fast- --limit 20 --json key --jq '.[].key' | grep -vx "$NOW" | while read -r k; do gh cache delete "$k" --repo "$GITHUB_REPOSITORY" || true; done
