name: edit chapter
run-name: ${{ inputs.label }}
# Edits one tutorial chapter: cut, render, narration (tools/tutorial-video/guide/cloud-edit.cjs in the app repo).
# prep cuts it, decides how many machines and plans the render, each part machine renders its share of that one plan,
# join stitches and narrates.
# This repo, its logs and its artifacts are public: the job arrives sealed with EMU_LIVE_KEY, moves between the
# machines sealed, leaves sealed, and everything the edit prints goes to a file that is sealed too. The key is
# only in the steps that seal. Runs only when asked, and holds no machine after the edit.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'edit-<random>: names this run and its sealed files in the edit-inbox release'
        required: true
permissions:
  contents: read
env:
  EDIT_DEPS: /home/runner/.edit-deps
  EDIT_OUT: /tmp/edit-out
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      parts: ${{ steps.edit.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/edit-tools
        with:
          render: 'true'
      - name: open the job
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
          LABEL: ${{ inputs.label }}
        run: |
          curl -fsSL -o /tmp/job.bin "https://github.com/$GITHUB_REPOSITORY/releases/download/edit-inbox/$LABEL.bin"
          node live/unseal-file.js /tmp/job.bin /tmp/job.tar
          tar xf /tmp/job.tar -C /tmp
          rm -f /tmp/job.bin /tmp/job.tar
      - name: cut
        id: edit
        run: node /tmp/job/run.cjs prep > /tmp/edit.log 2>&1
      - name: seal for the other machines
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          tar cf /tmp/job.tar -C /tmp job
          mkdir -p sealed/plan
          node live/seal-file.js /tmp/job.tar sealed/job.bin
          rm -f /tmp/job.tar
          # a seal holds the whole file in memory: a long chapter goes in pieces
          tar cf - -C /tmp edit-plan | split -b 1500M -d - /tmp/plan.tar.
          for f in /tmp/plan.tar.*; do
            node live/seal-file.js "$f" "sealed/plan/$(basename "$f").bin"
            rm -f "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: job
          path: sealed/job.bin
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: sealed/plan
          compression-level: 0
          retention-days: 1
      - name: seal the errors
        if: failure()
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          mkdir -p err
          [ -f /tmp/edit.log ] || echo 'failed before the edit started' > /tmp/edit.log
          node live/seal-file.js /tmp/edit.log err/err.bin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: err-prep
          path: err/err.bin
          retention-days: 1
  part:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        i: ${{ fromJSON(needs.prep.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/edit-tools
        with:
          render: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: job
          path: sealed
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: sealed/plan
      - name: open the job and the plan
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          node live/unseal-file.js sealed/job.bin /tmp/job.tar
          tar xf /tmp/job.tar -C /tmp
          rm -f sealed/job.bin /tmp/job.tar
          for f in sealed/plan/*.bin; do
            node live/unseal-file.js "$f" "/tmp/$(basename "$f" .bin)"
            rm -f "$f"
          done
          cat /tmp/plan.tar.* | tar xf - -C /tmp
          rm -f /tmp/plan.tar.*
      - name: render
        env:
          N: ${{ strategy.job-total }}
          I: ${{ matrix.i }}
        run: |
          mkdir -p "$EDIT_OUT"
          node /tmp/job/run.cjs part "$I" "$N" > /tmp/edit.log 2>&1
      - name: seal
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          tar cf /tmp/part.tar -C "$EDIT_OUT" .
          mkdir -p sealed
          node live/seal-file.js /tmp/part.tar sealed/part.bin
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.i }}
          path: sealed/part.bin
          compression-level: 0
          retention-days: 1
      - name: seal the errors
        if: failure()
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          mkdir -p err
          [ -f /tmp/edit.log ] || echo 'failed before the edit started' > /tmp/edit.log
          node live/seal-file.js /tmp/edit.log err/err.bin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: err-part-${{ matrix.i }}
          path: err/err.bin
          retention-days: 1
  join:
    needs: part
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/edit-tools
      - uses: actions/download-artifact@v4
        with:
          name: job
          path: sealed/job
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: sealed
      - name: open the parts
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          node live/unseal-file.js sealed/job/job.bin /tmp/job.tar
          tar xf /tmp/job.tar -C /tmp
          mkdir -p /tmp/parts
          for d in sealed/part-*; do
            node live/unseal-file.js "$d/part.bin" /tmp/part.tar
            tar xf /tmp/part.tar -C /tmp/parts
          done
          rm -rf sealed /tmp/job.tar /tmp/part.tar
      - name: join and narrate
        run: |
          mkdir -p "$EDIT_OUT"
          node /tmp/job/run.cjs join /tmp/parts > /tmp/edit.log 2>&1
      - name: seal and hand over
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.label }}
        run: |
          cp /tmp/edit.log "$EDIT_OUT/edit.log"
          tar cf /tmp/out.tar -C "$EDIT_OUT" .
          mkdir -p sealed
          node live/seal-file.js /tmp/out.tar "sealed/$LABEL.out.bin"
          gh release upload edit-inbox "sealed/$LABEL.out.bin" --repo "$GITHUB_REPOSITORY"
      - name: seal the errors
        if: failure()
        env:
          EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
        run: |
          mkdir -p err
          [ -f /tmp/edit.log ] || echo 'failed before the edit started' > /tmp/edit.log
          node live/seal-file.js /tmp/edit.log err/err.bin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: err-join
          path: err/err.bin
          retention-days: 1
