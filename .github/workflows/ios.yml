name: app test - iPhone
on:
  push:
    branches: [main]
    paths: ['ios/**', 'flows/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      locale:
        description: 'he / en'
        default: 'he'
jobs:
  ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build:
          - { name: new, url: ios/app-url.txt, flows: flows/config.yaml }
          - { name: old, url: ios/app-url-old.txt, flows: flows/config-home.yaml }
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: iPhone simulator
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_CODE: ${{ secrets.DEMO_CODE }}
          SIM_LOCALE: ${{ github.event.inputs.locale || 'he' }}
          APP_URL_FILE: ${{ matrix.build.url }}
          FLOW_CONFIG: ${{ matrix.build.flows }}
        run: bash ios/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-ios-${{ matrix.build.name }}
          path: shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-ios-${{ matrix.build.name }}
          path: video
