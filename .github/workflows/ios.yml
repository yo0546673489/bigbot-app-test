name: app test - iPhone
on:
  push:
    branches: [main]
    paths: ['ios/**', 'flows/**', '.github/workflows/ios.yml']
jobs:
  build:
    # Builds the iPhone SIMULATOR app from the private app repo (read-only deploy key) — no signing.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "ref=$(head -1 ios/build-ref.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: yo0546673489/bigbot
          ref: ${{ steps.ref.outputs.ref }}
          ssh-key: ${{ secrets.APP_REPO_KEY }}
          path: app
          fetch-depth: 1
          sparse-checkout: bigbot/mobile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build for the simulator
        working-directory: app/bigbot/mobile
        run: |
          set -x
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "xcode: $X"; [ -n "$X" ] && sudo xcode-select -s "$X"; xcodebuild -version
          git -C ../.. log -1 --format="%h %s"
          npm ci --no-audit --no-fund
          CI=1 npx expo prebuild -p ios --clean
          cd ios
          WS=$(ls -d *.xcworkspace | head -1); SCHEME=${WS%.xcworkspace}
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1); echo "$APP"
          tar -czf "$GITHUB_WORKSPACE/sim-app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-app
          path: sim-app.tar.gz
          retention-days: 3
  test:
    needs: build
    if: always()
    runs-on: macos-15
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        part:
          # - { name: old-home, url: ios/app-url-old.txt, flows: flows/config-home.yaml }
          # - { name: new-home, url: built, flows: flows/config-home.yaml }
          - { name: new-dialogs2, url: built, flows: flows/config-dialogs.yaml }
          - { name: new-dialogs, url: built, flows: flows/config-dialogs.yaml }
          # - { name: new-settings, url: built, flows: flows/config-settings.yaml }
          # - { name: new-deep, url: built, flows: flows/config-deep.yaml }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.part.url == 'built'
        with:
          name: sim-app
      - name: iPhone simulator
        timeout-minutes: 70
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_CODE: ${{ secrets.DEMO_CODE }}
          SIM_LOCALE: he
          APP_URL_FILE: ${{ matrix.part.url }}
          FLOW_CONFIG: ${{ matrix.part.flows }}
        run: bash ios/run.sh
      - name: collect screenshots
        if: always()
        run: bash ios/collect.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-ios-${{ matrix.part.name }}
          path: shots
