name: live emulator
run-name: ${{ inputs.label }}
# One emulator on one machine. It waits ready, a session claims it with cloud-emu.js, and it stops when not used.
# Nothing is printed: this repo and its logs are public. The address is sealed with EMU_LIVE_KEY before it leaves the job.
# For test accounts and fake data only, never a real WhatsApp, password or customer data.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Unique name, used to find this run'
        required: true
permissions:
  actions: read
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      EMU_LIVE_KEY: ${{ secrets.EMU_LIVE_KEY }}
      GH_TOKEN: ${{ github.token }}
      POOL_TTL_MIN: '40'
    steps:
      - uses: actions/checkout@v4
      - name: open the door
        run: |
          echo starting > /tmp/emu-state
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup node live/agent.js > /tmp/agent.log 2>&1 &
          echo $! > /tmp/agent.pid
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 60); do
            U=$(grep -o -m1 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$U" ] && break
            sleep 1
          done
          [ -n "$U" ] || exit 1
          mkdir -p conn
          U="$U" node -e "
            const c=require('crypto');const k=c.createHash('sha256').update(process.env.EMU_LIVE_KEY).digest();
            const iv=c.randomBytes(12);const a=c.createCipheriv('aes-256-gcm',k,iv);
            const ct=Buffer.concat([a.update(process.env.U),a.final()]);
            require('fs').writeFileSync('conn/conn.txt',[iv,a.getAuthTag(),ct].map(x=>x.toString('base64')).join('.'));"
      - uses: actions/upload-artifact@v4
        with:
          name: conn
          path: conn/conn.txt
          retention-days: 1
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        id: emu-cache
        with:
          key: emu-34-v1
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/system-images
            /home/runner/.android/avd
            /home/runner/.android/adbkey
            /home/runner/.android/adbkey.pub
      - name: prepare
        run: |
          echo preparing > /tmp/emu-state
          bash live/prepare.sh || { echo failed > /tmp/emu-state; exit 1; }
      - uses: actions/cache/save@v4
        if: steps.emu-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          key: emu-34-v1
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/system-images
            /home/runner/.android/avd
            /home/runner/.android/adbkey
            /home/runner/.android/adbkey.pub
      - name: start the emulator
        env:
          APK_URL: ${{ secrets.PRIVATE_APK_URL }}
        run: bash live/boot.sh
      - name: wait until it is not needed
        run: |
          while kill -0 "$(cat /tmp/agent.pid)" 2>/dev/null; do sleep 10; done
