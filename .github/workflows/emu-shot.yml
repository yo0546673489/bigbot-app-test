name: emulator shots
run-name: ${{ inputs.label }}
# Builds the debug app of a branch and photographs the debug review screens (real composables, fake data, no login)
# on an emulator of its own. Nothing runs on the PC, and many of these can run at once.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'App repo branch'
        required: true
      screens:
        description: 'Space separated: driver:16 station:o04 wamirror:list'
        required: true
      label:
        description: 'Unique name, used to find this run'
        required: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      SCREENS: ${{ inputs.screens }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yo0546673489/bigbot
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.APP_REPO_KEY }}
          path: app
          fetch-depth: 1
          sparse-checkout: bigbot/android
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: build the debug app
        working-directory: app/bigbot/android
        run: |
          git -C ../.. log -1 --format="%h %s"
          chmod +x gradlew
          ./gradlew "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g" :app:assembleDebug -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app.apk"
          ./gradlew --stop
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install the emulator
        run: |
          S=$ANDROID_HOME/cmdline-tools/latest/bin
          yes | $S/sdkmanager --licenses >/dev/null || true
          $S/sdkmanager --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" >/dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | $S/avdmanager create avd -n e1 -k "system-images;android-34;google_apis;x86_64" -d pixel_6 -p "$ANDROID_AVD_HOME/e1.avd" >/dev/null
          printf 'hw.ramSize=3072\nvm.heapSize=256\nhw.cpu.ncore=3\n' >> "$ANDROID_AVD_HOME/e1.avd/config.ini"
      - name: photograph the screens
        run: |
          set +e
          mkdir -p out
          boot() { adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done; }
          nohup emulator -avd e1 -port 5554 -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -camera-front none > out/emulator.log 2>&1 &
          boot
          adb root; sleep 3
          adb shell "setprop persist.sys.timezone Asia/Jerusalem; setprop persist.sys.locale he-IL; setprop ctl.restart zygote"
          sleep 5; boot; sleep 10
          adb install -r -g app.apk
          PKG=com.bigbotdrivers.app
          for item in $SCREENS; do
            kind=${item%%:*}; screen=${item#*:}
            case "$kind" in
              driver) cls=com.bigbot.app.designreview.DesignReviewActivity; extra="--ei screen $screen" ;;
              station) cls=com.bigbot.dispatcher.designreview.StationReviewActivity; extra="--es screen $screen" ;;
              wamirror) cls=com.bigbot.app.wamirror.WaMirrorPreviewActivity; extra="--es screen $screen" ;;
              *) echo "unknown kind: $kind"; continue ;;
            esac
            adb logcat -c
            adb shell am start -S -n "$PKG/$cls" $extra
            # first the splash, then the screen: photograph only when the picture stopped changing
            sleep 10
            prev=""; same=0
            for i in $(seq 1 25); do
              adb exec-out screencap -p > "out/$kind-$screen.png"
              cur=$(md5sum "out/$kind-$screen.png" | cut -d' ' -f1)
              if [ "$cur" = "$prev" ]; then same=$((same+1)); else same=0; fi
              prev=$cur
              [ $same -ge 2 ] && break
              sleep 3
            done
            adb logcat -d -b crash > "out/$kind-$screen-crash.txt"
            [ -s "out/$kind-$screen-crash.txt" ] || rm -f "out/$kind-$screen-crash.txt"
          done
          rm -f out/emulator.log
          ls -la out
      - uses: ./.github/actions/seal-upload
        if: always()
        with:
          name: shots
          path: out
          key: ${{ secrets.EMU_LIVE_KEY }}
          retention-days: 3
