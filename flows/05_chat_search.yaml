- waitForAnimationToEnd
- inputText: "0501234567"
- takeScreenshot: shots/05_02_new_chat_KEYBOARD
- tapOn:
    text: "פתח צ'אט"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
