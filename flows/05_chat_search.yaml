          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - back
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "(חזרה|סגור)"
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - back
- waitForAnimationToEnd
- runFlow:
