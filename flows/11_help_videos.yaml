appId: com.bigbotdrivers.app
name: 11 help videos in the app
---
# FIX-HELP-VIDEO-INAPP: every help clip plays inside the app, no browser; close returns to the list.
# The taps are required on purpose: a row that was not tapped must fail this test, not pass it.
# A row's text on iPhone also holds its icon and subtitle, so the texts match with .* around them.
- launchApp:
    permissions:
      all: allow
- tapOn:
    text: "דלג"
    optional: true
- openLink: "bigbot://tutorials"
- tapOn:
    text: "(פתיחה|Open)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/11_00_help_list
- tapOn:
    text: ".*כניסה ראשונה לאפליקציה.*"
- extendedWaitUntil:
    visible: "סגירה"
    timeout: 15000
- extendedWaitUntil:
    visible: "__wait_6s__"
    timeout: 6000
    optional: true
- takeScreenshot: shots/11_01_feat_login_playing
- tapOn:
    text: "מהירות הסרטון"
- extendedWaitUntil:
    visible: "__wait_2s__"
    timeout: 2000
    optional: true
- takeScreenshot: shots/11_02_speed_1_5
- tapOn:
    text: "סגירה"
- extendedWaitUntil:
    visible: ".*כניסה ראשונה לאפליקציה.*"
    timeout: 8000
- takeScreenshot: shots/11_03_back_on_list
- tapOn:
    text: ".*המדריך המלא לאפליקציה.*"
- extendedWaitUntil:
    visible: "סגירה"
    timeout: 15000
- extendedWaitUntil:
    visible: "__wait_6s__"
    timeout: 6000
    optional: true
- takeScreenshot: shots/11_04_full_guide_playing
- tapOn:
    text: "סגירה"
- extendedWaitUntil:
    visible: ".*המדריך המלא לאפליקציה.*"
    timeout: 8000
- tapOn:
    text: ".*מתחילים.*"
- extendedWaitUntil:
    visible: "סגירה"
    timeout: 15000
- extendedWaitUntil:
    visible: "__wait_6s__"
    timeout: 6000
    optional: true
- takeScreenshot: shots/11_05_topic_all_playing
- tapOn:
    text: "סגירה"
- extendedWaitUntil:
    visible: ".*המדריך המלא לאפליקציה.*"
    timeout: 8000
- takeScreenshot: shots/11_06_back_on_list_again
