appId: com.bigbotdrivers.app
name: 10 cleanup status - solo dispatcher (fake data)
---
# CLEANUP-STATUS (13/10/2026): the "ניקוי צ'אטים בארכיון" row says "מתנקה עכשיו" while a run is
# alive (also after the dialog was closed) and how it ended afterwards. The fake backend keeps a
# run "running" for 6 seconds, so no waitForAnimationToEnd while the spinner is on screen.
- launchApp:
    permissions:
      all: allow
- tapOn:
    text: "דלג"
    optional: true
- openLink: "bigbot://solo/preview?open=settings"
- tapOn:
    text: "(פתיחה|Open)"
    optional: true
# Right after a cold start the link can be handled late (the welcome screen is still up), so wait
# for the settings screen itself, and send the link once more when it did not come.
- extendedWaitUntil:
    visible: "הגדרות סדרן"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: "הגדרות סדרן"
    commands:
      - openLink: "bigbot://solo/preview?open=settings"
      - tapOn:
          text: "(פתיחה|Open)"
          optional: true
      - extendedWaitUntil:
          visible: "הגדרות סדרן"
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible: "__wait_2s__"
    timeout: 2500
    optional: true
- takeScreenshot: shots/10_00_settings_top
# On iOS the row is in the hierarchy even while it is below the fold, so scrollUntilVisible
# returns at once and the tap lands on the bottom bar. A plain scroll (as 09_solo does) first.
# A short slow drag (no fling): the row ends up BELOW the centred dialog and above the bottom bar,
# so the shot of the running dialog also shows the row's "מתנקה עכשיו" line behind it.
- swipe:
    start: 50%, 56%
    end: 50%, 45%
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: shots/10_01_row_before
- tapOn:
    text: "ניקוי צ'אטים בארכיון.*"
- extendedWaitUntil:
    visible: "כן, למחוק היסטוריה"
    timeout: 8000
    optional: true
- takeScreenshot: shots/10_02_confirm
# First run: close the dialog at once and shoot the ROW while the run is still alive (the fake run
# lasts 6 s and the row hears about its end on the 8 s poll), so no settling waits here.
- tapOn:
    text: "כן, למחוק היסטוריה"
    waitToSettleTimeoutMs: 200
- takeScreenshot: shots/10_03a_dialog_running_first
- takeScreenshot: shots/10_03b_dialog_running_first
# close by position (the dialog's "סגירה"; anywhere outside it closes too) - no hierarchy lookup,
# it has to happen within the 8 s the row still says "מתנקה עכשיו"
- tapOn:
    point: 50%, 61%
    waitToSettleTimeoutMs: 200
- takeScreenshot: shots/10_04_row_running
- extendedWaitUntil:
    visible: ".*הניקוי הסתיים.*"
    timeout: 25000
    optional: true
- takeScreenshot: shots/10_05_row_done
# a second run, this time the dialog stays open until the run ends
- tapOn:
    text: "ניקוי צ'אטים בארכיון.*"
- extendedWaitUntil:
    visible: "כן, למחוק היסטוריה"
    timeout: 8000
    optional: true
- tapOn:
    text: "כן, למחוק היסטוריה"
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: ".*הניקוי ממשיך לבד.*"
    timeout: 3000
    optional: true
- takeScreenshot: shots/10_03_dialog_running
- extendedWaitUntil:
    visible: ".*הניקוי הושלם בהצלחה.*"
    timeout: 25000
    optional: true
- takeScreenshot: shots/10_06_dialog_done
- tapOn:
    text: "סגירה"
- waitForAnimationToEnd
- takeScreenshot: shots/10_07_row_done_again
# the app is still alive after all of it
- openLink: "bigbot://solo/preview"
- tapOn:
    text: "(פתיחה|Open)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: shots/10_08_still_alive
