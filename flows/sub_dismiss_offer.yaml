appId: com.bigbotdrivers.app
name: sub dismiss tour offer
---
# Runs right after login, the app is still open. The offer opens 30 seconds after entering, and the answer is remembered.
- extendedWaitUntil:
    visible: "רוצה סיור באפליקציה?"
    timeout: 70000
    optional: true
- tapOn:
    text: "לא עכשיו"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: shots/00_08_offer_closed
# Each tab shows a one-time card on the first visit, it would cover the screens under test. Close each once.
- tapOn:
    text: "צ.אט"
    optional: true
- extendedWaitUntil:
    visible: "הבנתי"
    timeout: 8000
    optional: true
- tapOn:
    text: "הבנתי"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "חיפוש"
    optional: true
- extendedWaitUntil:
    visible: "הבנתי"
    timeout: 8000
    optional: true
- tapOn:
    text: "הבנתי"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "הגדרות"
    optional: true
- extendedWaitUntil:
    visible: "הבנתי"
    timeout: 8000
    optional: true
- tapOn:
    text: "הבנתי"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "בית"
    optional: true
- takeScreenshot: shots/00_09_cards_closed
