appId: com.bigbotdrivers.app
name: 01t reply tap
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      visible: "ביגבוט בוואטסאפ"
    commands:
      - tapOn: "המשך"
      - waitForAnimationToEnd:
          timeout: 8000
- tapOn:
    text: "אחר כך"
    optional: true
- extendedWaitUntil:
    visible: "לא עכשיו"
    timeout: 75000
    optional: true
- tapOn:
    text: "לא עכשיו"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: shots/n01_home
# the menu button, top right
- tapOn:
    point: "91%,9%"
- waitForAnimationToEnd
- takeScreenshot: shots/n02_drawer
# the notifications row, by position: it carries a count badge, so its text is not a plain match
- tapOn:
    point: "75%,48%"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "הבנתי"
    commands:
      - tapOn: "הבנתי"
      - waitForAnimationToEnd
- takeScreenshot: shots/n03_notifications
