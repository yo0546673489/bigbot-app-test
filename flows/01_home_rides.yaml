appId: com.bigbotdrivers.app
name: 01 home and rides
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "אחר כך"
    optional: true
- extendedWaitUntil:
    visible: "בית"
    timeout: 20000
    optional: true
- tapOn:
    text: "בית"
    optional: true
- takeScreenshot: shots/01_01_home
# the availability SWITCH (left side of the status card)
- tapOn:
    point: "12%,17%"
- waitForAnimationToEnd
- takeScreenshot: shots/01_02_available_on
# Demo account: 3 sample rides after (re)connect.
- extendedWaitUntil:
    visible: ".*(בני ברק|ירושלים|פתח תקווה).*"
    timeout: 45000
    optional: true
- takeScreenshot: shots/01_03_home_with_rides
- runFlow:
    file: sub_add_route.yaml
    env: { ORIGIN: "ים", DEST: "בב" }
- takeScreenshot: shots/01_04_CHIPS_one_route
- runFlow:
    file: sub_add_route.yaml
    env: { ORIGIN: "תא", DEST: "פת" }
- runFlow:
    file: sub_add_route.yaml
    env: { ORIGIN: "רג", DEST: "בש" }
- runFlow:
    file: sub_add_route.yaml
    env: { ORIGIN: "חי", DEST: "נת" }
- runFlow:
    file: sub_add_route.yaml
    env: { ORIGIN: "אש", DEST: "בא" }
- takeScreenshot: shots/01_05_CHIPS_overflow_must_start_right
- swipe:
    start: "30%,29%"
    end: "85%,29%"
- takeScreenshot: shots/01_06_CHIPS_after_swipe
- swipe:
    start: "85%,29%"
    end: "30%,29%"
- takeScreenshot: shots/01_07_CHIPS_swipe_back
- tapOn:
    text: ".*(מיקום כבוי|מיקום פעיל).*"
    optional: true
- tapOn:
    text: "(Allow|Allow While Using App|Allow Once|אישור|אפשר|מותר|While using the app).*"
    optional: true
- tapOn:
    text: ".*(קריינות|שקט)$"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: shots/01_08_action_chips_changed
- extendedWaitUntil:
    visible: ".*(בני ברק|ירושלים|פתח תקווה).*"
    timeout: 30000
    optional: true
- takeScreenshot: shots/01_09_rides
# ride card reply button
- tapOn:
    text: "ת"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: shots/01_10_after_tap_reply
- extendedWaitUntil:
    visible: "__wait_6s__"
    timeout: 6000
    optional: true
- takeScreenshot: shots/01_11_after_reply_result
- scroll
- takeScreenshot: shots/01_12_rides_scrolled
- scroll
- takeScreenshot: shots/01_13_rides_scrolled2
