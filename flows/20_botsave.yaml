appId: com.bigbotdrivers.app
name: 20 the save-the-bot screen only from day two
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 25000
    optional: true
- takeScreenshot: shots/d1_first_day
- assertNotVisible: "ביגבוט בוואטסאפ"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 25000
    optional: true
- takeScreenshot: shots/d1_first_day_reopened
- assertNotVisible: "ביגבוט בוואטסאפ"
# The helper on the server moves this account's first-use date 25 hours back, 6 minutes after it was set.
- extendedWaitUntil:
    visible: "NEVER-THERE-WAIT-FOR-THE-DATE"
    timeout: 420000
    optional: true
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "ביגבוט בוואטסאפ"
    timeout: 45000
- takeScreenshot: shots/d2_prompt
- tapOn: "המשך"
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 15000
    optional: true
- takeScreenshot: shots/d2_after_answer
- assertNotVisible: "ביגבוט בוואטסאפ"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 25000
    optional: true
- takeScreenshot: shots/d2_not_asked_again
- assertNotVisible: "ביגבוט בוואטסאפ"
