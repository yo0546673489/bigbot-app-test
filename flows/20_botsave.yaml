appId: com.bigbotdrivers.app
name: 20 the save-the-bot screen only from day two
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 25000
    optional: true
- takeScreenshot: shots/d1_first_day
- assertNotVisible: "ביגבוט בוואטסאפ"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 25000
    optional: true
- takeScreenshot: shots/d1_first_day_reopened
- assertNotVisible: "ביגבוט בוואטסאפ"
# Tells the helper on the server (it reads the access log) to move this account's first-use date 25 hours back.
- evalScript: ${http.get('https://api.bigbotdrivers.com/botsave-signal-d1-r4')}
- extendedWaitUntil:
    visible: "NEVER-THERE-WAIT-FOR-THE-DATE"
    timeout: 15000
    optional: true
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "ביגבוט בוואטסאפ"
    timeout: 45000
- takeScreenshot: shots/d2_prompt
- tapOn: "המשך"
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 15000
    optional: true
- takeScreenshot: shots/d2_after_answer
- assertNotVisible: "ביגבוט בוואטסאפ"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "NEVER-THERE-LET-HOME-SETTLE"
    timeout: 25000
    optional: true
- takeScreenshot: shots/d2_not_asked_again
- assertNotVisible: "ביגבוט בוואטסאפ"
