appId: com.bigbotdrivers.app
name: add route (sub)
---
- tapOn:
    text: ".*הוסף$"
    index: 0
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "לדוגמה: נתניה"
    optional: true
- inputText: ${ORIGIN}
- tapOn:
    text: "הוסף יעד.*"
    optional: true
- inputText: ${DEST}
- takeScreenshot: shots/01_route_${ORIGIN}_typed
- tapOn:
    text: "הוסף מסלול"
    optional: true
# the sheet's own "הוסף" button sits left of "ביטול" (RTL)
- tapOn:
    text: "הוסף"
    leftOf:
      text: "ביטול"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: shots/01_route_${ORIGIN}_after_add
- runFlow:
    when:
      visible: "הוסף מסלול"
    commands:
      - tapOn:
          text: "ביטול"
          optional: true
