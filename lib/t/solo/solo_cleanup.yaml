appId: com.bigbotdrivers.app
name: lib solo solo_cleanup
---
- launchApp:
    stopApp: true
    permissions:
      all: allow
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "דלג"
    optional: true
- runFlow:
    when:
      visible: "ביגבוט בוואטסאפ"
    commands:
      - tapOn: "המשך"
- tapOn:
    text: "אחר כך"
    optional: true
- openLink: "bigbot://solo/preview?open=home"
- tapOn:
    text: "(פתיחה|Open|פתח)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      text: "תפריט"
    direction: DOWN
    timeout: 6000
    optional: true
- tapOn:
    text: "תפריט"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element:
      text: ".*ניקוי צ.אטים.*"
    direction: DOWN
    timeout: 6000
    optional: true
- tapOn:
    text: ".*ניקוי צ.אטים.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 2500
    optional: true
