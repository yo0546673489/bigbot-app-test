appId: com.bigbotdrivers.app
name: lib demo app_groups_link
---
- launchApp:
    stopApp: true
    permissions:
      all: allow
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "דלג"
    optional: true
- runFlow:
    when:
      visible: "ביגבוט בוואטסאפ"
    commands:
      - tapOn: "המשך"
- tapOn:
    text: "אחר כך"
    optional: true
- openLink: "bigbot://app-groups/link?id=demo-g1"
- tapOn:
    text: "(פתיחה|Open|פתח)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 2500
    optional: true
