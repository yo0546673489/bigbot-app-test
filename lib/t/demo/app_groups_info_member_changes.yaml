appId: com.bigbotdrivers.app
name: lib demo app_groups_info_member_changes
---
- launchApp:
    stopApp: true
    permissions:
      all: allow
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "דלג"
    optional: true
- runFlow:
    when:
      visible: "ביגבוט בוואטסאפ"
    commands:
      - tapOn: "המשך"
- tapOn:
    text: "אחר כך"
    optional: true
- openLink: "bigbot://app-groups/info?id=demo-g1"
- tapOn:
    text: "(פתיחה|Open|פתח)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      text: ".*הצגת השינויים בפרטי החברים.*"
    direction: DOWN
    timeout: 6000
    optional: true
- tapOn:
    text: ".*הצגת השינויים בפרטי החברים.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible: "__settle__"
