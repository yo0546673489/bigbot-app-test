appId: com.bigbotdrivers.app
name: lib main search_add_route
---
- launchApp:
    stopApp: true
    permissions:
      all: allow
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "דלג"
    optional: true
- runFlow:
    when:
      visible: "ביגבוט בוואטסאפ"
    commands:
      - tapOn: "המשך"
- tapOn:
    text: "אחר כך"
    optional: true
- openLink: "bigbot://search"
- tapOn:
    text: "(פתיחה|Open|פתח)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      text: ".*הוסף מסלול.*"
    direction: DOWN
    timeout: 6000
    optional: true
- tapOn:
    text: ".*הוסף מסלול.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 2500
    optional: true
