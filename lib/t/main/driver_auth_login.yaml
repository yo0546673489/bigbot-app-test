appId: com.bigbotdrivers.app
name: lib main driver_auth_login
---
- launchApp:
    stopApp: true
    permissions:
      all: allow
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "דלג"
    optional: true
- runFlow:
    when:
      visible: "ביגבוט בוואטסאפ"
    commands:
      - tapOn: "המשך"
- tapOn:
    text: "אחר כך"
    optional: true
- openLink: "bigbot://driver-auth"
- tapOn:
    text: "(פתיחה|Open|פתח)"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      text: ".*לא עכשיו.*"
    direction: DOWN
    timeout: 6000
    optional: true
- tapOn:
    text: ".*לא עכשיו.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- scrollUntilVisible:
    element:
      text: ".*התחברות.*"
    direction: DOWN
    timeout: 6000
    optional: true
- tapOn:
    text: ".*התחברות.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible: "__settle__"
    timeout: 2500
    optional: true
